
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | ENVAULT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #211f2d;
            color: #f4f1fa;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: #2d293b;
            border: 1px solid #49415c;
            border-radius: 16px;
            padding: 36px;
        }

        .brand {
            color: #b69af5;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .auth-title {
            color: #d0c5e8;
        }

        .form-label {
            color: #e0d9ed;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #514963;
            border-radius: 7px;
            background: #211f2d;
            color: #ffffff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #9874df;
            box-shadow: 0 0 0 3px rgba(152, 116, 223, 0.2);
        }

        .auth-btn {
            background: #7657c8;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 600;
        }

        .auth-btn:hover {
            background: #6244ae;
            color: white;
        }

        .auth-link {
            color: #b69af5;
            text-decoration: none;
        }

        .auth-link:hover {
            color: #d0bfff;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="auth-card shadow-lg">

        <h2 class="text-center mb-2 brand">ENVAULT</h2>
        <h5 class="text-center auth-title mb-4">{{ title }}</h5>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}

                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}

            {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <button type="submit" class="auth-btn w-100">
                {{ button_text }}
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url link_url %}" class="auth-link">
                {{ link_text }}
            </a>
        </div>

    </div>
</div>

</body>
</html>
