<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ENVAULT | Manage Members</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width:650px;">

    <a href="{% url 'project_dashboard' %}" class="text-decoration-none">
        ← Back to Dashboard
    </a>

    <div class="card border-0 shadow-sm mt-4">
        <div class="card-body p-4">
            <h3 class="fw-bold">Manage Project Members</h3>
            <p class="text-muted">
                Add a registered user to {{ project.name }}.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Select User</label>
                    {{ form.user }}
                    {{ form.user.errors }}
                </div>

                <div class="form-check mb-4">
                    {{ form.can_reveal_secrets }}
                    <label class="form-check-label">
                        Allow this member to reveal sensitive variables
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Member
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
